# Publish the model catalog. The marketplace is a CATALOG, not a weight host:
# this job gathers source METADATA only (Hugging Face + Ollama), computes the
# provenance-backed ratings, runs the license and regression gates, and
# publishes a static catalog.json. The client pulls weights straight from the
# source; OpenShore never rehosts them.
#
# Where it publishes: openshore.ai is a Cloudflare Pages site built from the
# OpenShore.ai-marketing-site repo (formerly a subpage of
# Open-Shore-LLC-Homepage; that repo now serves openshorellc.com instead),
# whose Eleventy build passes src/static through to the site root. So a file
# committed to that repo at src/static/os-code/catalog.json is served at
# openshore.ai/os-code/catalog.json, which is exactly what config.catalog.url
# defaults to. This job builds the catalog here (where the os-code toolchain
# lives) and commits it there; the Cloudflare Pages deploy then ships it. On
# any gate breach the job writes and publishes NOTHING, and the previously
# published catalog keeps serving.
#
# One-time setup (see os-code/docs/MARKETPLACE.md): a repository secret named
# MARKETING_DEPLOY_TOKEN, a fine-grained PAT scoped to
# OpenShore.ai-marketing-site with Contents: read and write. Without it the
# publish step is skipped and the job just proves the catalog builds.
#
# Secrets are scoped to the ONE step that needs each of them (step-level env),
# never the whole job. A job-level secret is in the environment of
# `pnpm install` (which runs package build scripts), of the test run, and of
# the builder's discovery fetches against arbitrary Hugging Face repos; the
# marketing PAT writes to a site Cloudflare deploys unattended, so none of
# those should be able to read it.
name: Publish model catalog

on:
  # Daily refresh so popularity, recency, and live discovery (new GGUF repos
  # joining the browse list on their own) stay current. Off the top of the hour
  # to avoid the scheduler stampede. The no-op stamp guard means an unchanged
  # run does not commit, so a quiet day is close to free.
  schedule:
    - cron: '17 8 * * *'
  # Rebuild whenever the curation inputs, the builder, or the schema change.
  push:
    branches: [main]
    paths:
      - 'os-code/curation/**'
      - 'os-code/catalog.sample.json'
      - 'os-code/scripts/build-catalog/**'
      - 'os-code/src/market/schema.ts'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:
    inputs:
      # The builder refuses a catalog whose model count collapses against the
      # live baseline (a broken discovery run must not publish an empty
      # marketplace). When a large drop is intended, a curation purge for
      # example, run the workflow by hand with this on; it sets
      # CATALOG_ALLOW_LARGE_DROP=1 for that one build only.
      allow_large_drop:
        description: 'Waive the count-collapse guard for this run (CATALOG_ALLOW_LARGE_DROP=1)'
        type: boolean
        default: false

# The job only reads this repo. The publish step pushes to the marketing repo
# with its own PAT, so the workflow token needs no write scope here. Every
# action is pinned to a commit SHA so a moved tag cannot swap the code that
# runs with these secrets.
permissions:
  contents: read

# One catalog publish at a time; never let two runs race the marketing repo.
concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      # Only a yes/no travels at job level, so the publish gate can test
      # whether the token is configured without the token itself being in
      # every step's environment. An unset secret resolves to an empty string.
      MARKETING_DEPLOY_CONFIGURED: ${{ secrets.MARKETING_DEPLOY_TOKEN != '' }}
      # This job never launches Electron: skip the binary download and the
      # electron-rebuild of node-pty (the app's postinstall honors this guard).
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      SKIP_NATIVE_REBUILD: '1'
    steps:
      - name: Check out the engine repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the engine
        run: pnpm --filter os-code build

      - name: Guard the builder isolation and gates
        run: pnpm --filter os-code exec vitest run catalog.builder scripts.isolation

      # Seed the regression baseline with whatever is live today, so the gate
      # compares the new catalog against what users actually have. The builder
      # reads this same path as `previous` and overwrites it on success. A 404
      # on the first ever run is fine: no baseline means nothing to regress.
      - name: Seed the regression baseline from the live catalog
        run: |
          set -euo pipefail
          mkdir -p os-code/build
          tmp=os-code/build/catalog.json.tmp
          rm -f "$tmp"
          # --fail: treat a 4xx/5xx as a curl error, not a 200 whose HTML error
          # body would be written over the baseline. --retry rides out a
          # transient CDN blip. -w prints the final HTTP code even on failure, so
          # a genuine 404 (no catalog published yet: first ever run, allowed) is
          # told apart from EVERY other failure (a 5xx, an HTML error page,
          # DNS/connection death), which must FAIL the job rather than build
          # ungated against a missing or partial baseline.
          # The query string busts Cloudflare's edge cache, which otherwise
          # hands back the catalog from before the previous publish, so the
          # baseline (and discovery's carry-forward) would lag a run behind.
          code="$(curl --fail --retry 3 --retry-delay 2 -sSL \
            -H 'Cache-Control: no-cache' \
            -o "$tmp" -w '%{http_code}' \
            "https://openshore.ai/os-code/catalog.json?baseline=$(date +%s)")" && rc=0 || rc=$?
          if [ "${rc:-0}" -eq 0 ]; then
            mv "$tmp" os-code/build/catalog.json
            echo 'Seeded the regression baseline from the live catalog.'
          elif [ "${code:-}" = "404" ]; then
            rm -f "$tmp"
            echo 'No live catalog yet (HTTP 404); building without a baseline (first ever run).'
          else
            rm -f "$tmp"
            echo "::error::Could not fetch the live catalog to seed the baseline (curl exit ${rc}, HTTP ${code:-none}). Refusing to build ungated." >&2
            exit 1
          fi

      - name: Build the catalog
        env:
          # Optional: an authenticated Hugging Face token lifts the anonymous
          # rate limit on the popularity fetch. Absent, the build stays anonymous.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Optional: the reviews backend, so the builder bakes a community-review
          # snapshot into the catalog (the scale path: a browse row shows a crowd
          # star with no per-view request to Supabase). The anon key is enough,
          # the snapshot RPC returns only aggregates over visible rows. Both
          # unset, the build ships without the snapshot and the app falls back
          # to the live browse RPC, exactly as before.
          CATALOG_REVIEWS_URL: ${{ secrets.CATALOG_REVIEWS_URL }}
          CATALOG_REVIEWS_ANON_KEY: ${{ secrets.CATALOG_REVIEWS_ANON_KEY }}
          # '1' only on a manual run that asked for it; empty (unset) otherwise,
          # so a scheduled or push-triggered build is always gated.
          CATALOG_ALLOW_LARGE_DROP: ${{ inputs.allow_large_drop == true && '1' || '' }}
        run: pnpm --filter os-code build:catalog

      - name: Publish to the marketing site
        if: ${{ env.MARKETING_DEPLOY_CONFIGURED == 'true' }}
        env:
          # The only step that sees the marketing PAT.
          MARKETING_DEPLOY_TOKEN: ${{ secrets.MARKETING_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          # --branch main: the clone must start from main itself, whatever the
          # repo's default branch happens to be (a run landed the catalog on a
          # feature branch and then could not push it to main).
          git clone --depth 1 --branch main --single-branch \
            "https://x-access-token:${MARKETING_DEPLOY_TOKEN}@github.com/openshore-labs/OpenShore.ai-marketing-site.git" \
            marketing
          install -D os-code/build/catalog.json marketing/src/static/os-code/catalog.json
          cd marketing
          git add src/static/os-code/catalog.json
          # --cached so a brand-new (untracked) catalog file also counts as a
          # change; a plain git diff would miss it and skip the first publish.
          if git diff --cached --quiet; then
            echo 'Catalog unchanged; nothing to publish.'
            exit 0
          fi
          git config user.name 'openshore-catalog-bot'
          git config user.email 'catalog-bot@openshore.ai'
          git commit -m "Publish model catalog ($(date -u +%Y-%m-%d))"
          # A human commit can land on marketing main between our shallow clone
          # and our push, rejecting it and stranding the catalog until the next
          # scheduled run (up to a day). Rebase our single-file commit onto the
          # advanced main and retry a few times so a concurrent commit does not
          # cost a day of staleness.
          attempts=3
          n=1
          until git push origin HEAD:main; do
            if [ "$n" -ge "$attempts" ]; then
              echo "::error::Could not publish the catalog after ${attempts} attempts; marketing main kept advancing." >&2
              exit 1
            fi
            echo "Push rejected (main advanced); fetching and rebasing (attempt ${n})."
            # A shallow single-branch clone has no refs/remotes/origin/main to
            # rebase onto; FETCH_HEAD is what the fetch just brought in.
            git fetch --depth=50 origin main
            git rebase FETCH_HEAD
            n=$((n + 1))
          done

      - name: Note when publishing is not configured
        if: ${{ env.MARKETING_DEPLOY_CONFIGURED != 'true' }}
        run: |
          echo 'MARKETING_DEPLOY_TOKEN is not set, so the catalog was built and'
          echo 'gated but not published. Add the secret to enable publishing.'

      - name: Upload the built catalog as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog
          path: os-code/build/catalog.json
