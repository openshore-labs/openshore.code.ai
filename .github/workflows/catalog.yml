# Publish the model catalog. The marketplace is a CATALOG, not a weight host:
# this job gathers source METADATA only (Hugging Face + Ollama), computes the
# provenance-backed ratings, runs the license and regression gates, and
# publishes a static catalog.json. The client pulls weights straight from the
# source; OpenShore never rehosts them.
#
# Where it publishes: openshore.ai is a Cloudflare Pages site built from the
# Open-Shore-LLC-Homepage repo, whose Eleventy build passes src/static through
# to the site root. So a file committed to that repo at
# src/static/os-code/catalog.json is served at openshore.ai/os-code/catalog.json,
# which is exactly what config.catalog.url defaults to. This job builds the
# catalog here (where the os-code toolchain lives) and commits it there; the
# Cloudflare Pages deploy then ships it. On any gate breach the job writes and
# publishes NOTHING, and the previously published catalog keeps serving.
#
# One-time setup (see os-code/docs/MARKETPLACE.md): a repository secret named
# MARKETING_DEPLOY_TOKEN, a fine-grained PAT scoped to Open-Shore-LLC-Homepage
# with Contents: read and write. Without it the publish step is skipped and the
# job just proves the catalog builds.
name: Publish model catalog

on:
  # Weekly refresh so popularity and recency stay current. Off the top of the
  # hour to avoid the scheduler stampede.
  schedule:
    # Twice weekly (Mon + Thu) for fresher popularity. The no-op stamp guard
    # means an unchanged run does not commit, so the extra run is close to free.
    - cron: '17 8 * * 1,4'
  # Rebuild whenever the curation inputs, the builder, or the schema change.
  push:
    branches: [main]
    paths:
      - 'os-code/curation/**'
      - 'os-code/catalog.sample.json'
      - 'os-code/scripts/build-catalog/**'
      - 'os-code/src/market/schema.ts'
      - '.github/workflows/catalog.yml'
  workflow_dispatch: {}

# One catalog publish at a time; never let two runs race the marketing repo.
concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Mapped once so the publish gate can test whether it is configured. An
    # unset secret resolves to an empty string.
    env:
      MARKETING_DEPLOY_TOKEN: ${{ secrets.MARKETING_DEPLOY_TOKEN }}
      # Optional: an authenticated Hugging Face token lifts the anonymous rate
      # limit on the popularity fetch. Absent, the build stays anonymous.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Check out the engine repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the engine
        run: pnpm --filter os-code build

      - name: Guard the builder isolation and gates
        run: pnpm --filter os-code exec vitest run catalog.builder scripts.isolation

      # Seed the regression baseline with whatever is live today, so the gate
      # compares the new catalog against what users actually have. The builder
      # reads this same path as `previous` and overwrites it on success. A 404
      # on the first ever run is fine: no baseline means nothing to regress.
      - name: Seed the regression baseline from the live catalog
        run: |
          set -euo pipefail
          mkdir -p os-code/build
          tmp=os-code/build/catalog.json.tmp
          rm -f "$tmp"
          # --fail: treat a 4xx/5xx as a curl error, not a 200 whose HTML error
          # body would be written over the baseline. --retry rides out a
          # transient CDN blip. -w prints the final HTTP code even on failure, so
          # a genuine 404 (no catalog published yet: first ever run, allowed) is
          # told apart from EVERY other failure (a 5xx, an HTML error page,
          # DNS/connection death), which must FAIL the job rather than build
          # ungated against a missing or partial baseline.
          code="$(curl --fail --retry 3 --retry-delay 2 -sSL \
            -o "$tmp" -w '%{http_code}' \
            https://openshore.ai/os-code/catalog.json)" && rc=0 || rc=$?
          if [ "${rc:-0}" -eq 0 ]; then
            mv "$tmp" os-code/build/catalog.json
            echo 'Seeded the regression baseline from the live catalog.'
          elif [ "${code:-}" = "404" ]; then
            rm -f "$tmp"
            echo 'No live catalog yet (HTTP 404); building without a baseline (first ever run).'
          else
            rm -f "$tmp"
            echo "::error::Could not fetch the live catalog to seed the baseline (curl exit ${rc}, HTTP ${code:-none}). Refusing to build ungated." >&2
            exit 1
          fi

      - name: Build the catalog
        run: pnpm --filter os-code build:catalog

      - name: Publish to the marketing site
        if: ${{ env.MARKETING_DEPLOY_TOKEN != '' }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${MARKETING_DEPLOY_TOKEN}@github.com/openshore-labs/Open-Shore-LLC-Homepage.git" \
            marketing
          install -D os-code/build/catalog.json marketing/src/static/os-code/catalog.json
          cd marketing
          git add src/static/os-code/catalog.json
          # --cached so a brand-new (untracked) catalog file also counts as a
          # change; a plain git diff would miss it and skip the first publish.
          if git diff --cached --quiet; then
            echo 'Catalog unchanged; nothing to publish.'
            exit 0
          fi
          git config user.name 'openshore-catalog-bot'
          git config user.email 'catalog-bot@openshore.ai'
          git commit -m "Publish model catalog ($(date -u +%Y-%m-%d))"
          # A human commit can land on marketing main between our shallow clone
          # and our push, rejecting it and stranding the catalog until the next
          # scheduled run (up to a week). Rebase our single-file commit onto the
          # advanced main and retry a few times so a concurrent commit does not
          # cost a week of staleness.
          attempts=3
          n=1
          until git push origin HEAD:main; do
            if [ "$n" -ge "$attempts" ]; then
              echo "::error::Could not publish the catalog after ${attempts} attempts; marketing main kept advancing." >&2
              exit 1
            fi
            echo "Push rejected (main advanced); fetching and rebasing (attempt ${n})."
            git fetch --depth=50 origin main
            git rebase origin/main
            n=$((n + 1))
          done

      - name: Note when publishing is not configured
        if: ${{ env.MARKETING_DEPLOY_TOKEN == '' }}
        run: |
          echo 'MARKETING_DEPLOY_TOKEN is not set, so the catalog was built and'
          echo 'gated but not published. Add the secret to enable publishing.'

      - name: Upload the built catalog as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: os-code/build/catalog.json
