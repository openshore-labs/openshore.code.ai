# Continuous integration: lint, typecheck, and test the whole workspace on
# every push to main and every PR that targets it, and run the pgTAP suite
# against the Supabase migrations two ways: built from empty (the `sql` job)
# and replaying production's recorded history first (the `sql-replay` job,
# CTO 11), when supabase/ changed (`changes`). Before this workflow existed
# the only gate was Codemagic, which ships each main push straight to TestFlight
# WITHOUT running the suite, so the em-dash guard, redaction tests, RBAC/crypto
# tests, and the security tests only ever ran on a developer's machine. This is
# the missing net: a red run here surfaces the break before anyone trusts main.
#
# Setup steps (pnpm version, node version, cache) are kept byte-for-byte in sync
# with catalog.yml so both workflows resolve the same toolchain. The Node
# version comes from .nvmrc, the one place it is written down (codemagic.yaml
# carries the same number by hand, since Codemagic cannot read the file).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A run started by hand runs every job (see `changes`).
  workflow_dispatch:

# Nothing here writes to the repo, so the job token is read-only. Every action
# below is pinned to a commit SHA for the same reason: a moved tag cannot swap
# the code that runs with that token.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a rapid push sequence does not pile
# up redundant CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never launches Electron. Skip the Electron binary download in the
  # electron package's install script, and skip the electron-rebuild of
  # node-pty in the app's postinstall (scripts/postinstall.mjs honors this
  # guard). Both only serve a desktop launch, which no step here performs.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  SKIP_NATIVE_REBUILD: "1"

jobs:
  # What this push touched (founder, 2026-10-01: a one-person team on a
  # private repo pushes everything to main, and every push used to spend the
  # whole run against the month's Actions minutes). `check` runs on every
  # push. The two database jobs run only when supabase/ changed, and the
  # Windows job (billed at double the minutes) only when the engine, the
  # desktop shell, its tests or the dependencies did. On main the diff starts
  # at the last green CI run, not the previous push, so a run cancelled by a
  # quick next push never lets a change skip its jobs. A pull request diffs
  # against its base; a run by hand, a first push, or a base this clone cannot
  # see runs everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      db: ${{ steps.diff.outputs.db }}
      windows: ${{ steps.diff.outputs.windows }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: What this change touched
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          everything() {
            echo "db=true" >> "$GITHUB_OUTPUT"
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "Running every job: $1"
            exit 0
          }
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push)
              base="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
                --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)" ;;
            *) everything "started by hand" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            everything "no base to compare against"
          fi
          # Notes and records (*.md) never need a database or a Windows run.
          files="$(git diff --name-only "$base" HEAD | grep -v '\.md$' || true)"
          echo "Changed since $base, notes left out:"
          echo "$files"
          if echo "$files" | grep -Eq '^(supabase/|\.github/workflows/ci\.yml$)'; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "db=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -Eq '^(os-code/|app/electron/|app/package\.json$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.nvmrc$|\.github/workflows/ci\.yml$|app/test/(mainIpc|mainGuards|updateState|updateVersion|shellHost|daemonLifecycle|pairingCredential|privacyCalls|ollamaHost|lifecycle)\.test\.ts$)'; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Build the engine first. The app package imports `os-code/protocol`, which
      # resolves to os-code's built dist; without this step `pnpm -r typecheck`
      # (and any app test that touches the protocol types) fails in CI with
      # "Cannot find module 'os-code/protocol'". Kept before lint/typecheck/test
      # so every downstream step sees a real dist, matching catalog.yml.
      - name: Build the engine
        run: pnpm --filter os-code build

      # OS Code, the terminal CLI, ships to npm as `os-code`
      # (cli-publish.yml). Install the packed tarball into an empty prefix and
      # run it, so a file the CLI needs at runtime can never be left out of
      # the package.
      - name: Install the CLI from its package and run it
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/osc-pack"
          mkdir -p "$OUT/prefix" "$OUT/home"
          (cd os-code && npm pack --pack-destination "$OUT" >/dev/null)
          npm install -g --prefix "$OUT/prefix" "$OUT"/os-code-*.tgz >/dev/null
          HOME="$OUT/home" "$OUT/prefix/bin/osc" --version
          HOME="$OUT/home" "$OUT/prefix/bin/osc" --plain market browse | head -3

      # Then build every package, which is where the app's `vite build` and the
      # Electron `tsc` emit run. Until this step existed a bundling break (a bad
      # `@import` in theme.css, a renderer import of a Node-only module) passed
      # lint, typecheck, and test, reached main, and was first seen on the
      # TestFlight pipeline. Runs in workspace order, so the engine dist above
      # is what the app build links against.
      - name: Build every package
        run: pnpm -r build

      # A Personal build carries no later tier (docs/release-tiers.md): no
      # Stack Health, Launch, Marketplace, or Admin room, none of their words,
      # and every room its own chunk that waits for its first open. Reads the
      # app build the step above just made (VITE_RELEASE_TIER unset), reports
      # what a launch loads, and fails on anything that should not be there.
      - name: Check the Personal bundle
        run: pnpm --filter oscode-app check:bundle

      # Prettier drift used to be invisible: neither package's formatting was
      # checked here, so files quietly diverged from .prettierrc. `pnpm format`
      # in a package fixes what this step reports.
      - name: Format check
        run: pnpm -r format:check

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # The Supabase edge functions are Deno, not a workspace package, so their
      # tests (the entitlement gate the checkout and webhook logic leans on)
      # never ran under `pnpm -r test`. Deno fetches the std imports itself.
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Test the edge-function shared modules
        run: deno test supabase/functions/_shared

  # CTO 10 (2026-09-29): the engine and the desktop shell run on Windows too,
  # where there is no /bin/bash (the runner resolves Git Bash, else
  # PowerShell), paths use backslashes, and a process tree ends with taskkill.
  # This job runs the engine's whole suite there, plus the app's Electron-side
  # tests (the main process's IPC and guards, the updater, the engine host,
  # the daemon lifecycle). The app's UI suite renders the same on any OS and
  # Windows minutes cost double, so it stays on Linux in `check`. A test that
  # needs POSIX is skipped on win32 with its reason, never loosened.
  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Tests that read source match on LF line ends; the runner's git would
      # otherwise check the tree out with CRLF.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the engine
        run: pnpm --filter os-code build

      - name: Test the engine
        run: pnpm --filter os-code test

      - name: Test the desktop shell's main-process side
        working-directory: app
        run: >-
          pnpm exec vitest run
          test/mainIpc.test.ts
          test/mainGuards.test.ts
          test/updateState.test.ts
          test/updateVersion.test.ts
          test/shellHost.test.ts
          test/daemonLifecycle.test.ts
          test/pairingCredential.test.ts
          test/privacyCalls.test.ts
          test/ollamaHost.test.ts
          test/lifecycle.test.ts

  # The pgTAP suite (supabase/tests/*.test.sql) against every migration,
  # applied in order from an empty database (Vault v1 plan item 2.4, CTO
  # ruling G4). It runs beside `check`, not after it. It uses the Supabase CLI,
  # never a bare postgres image or a stubbed auth schema: the migrations and
  # tests lean on the real auth.users (email_confirmed_at), auth.uid(), and
  # the anon/authenticated/service_role roles, and a stub would drift from
  # production without anyone noticing. This is exactly what the founder runs
  # locally.
  sql:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # v1.7.3 is the last v1 release, a plain node20 action with its bundle
      # checked in (v2 and v3 install Bun and their dependencies at run time).
      # The CLI itself is pinned to an exact version below.
      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.118.0

      # `supabase db start` on 2.118.0 starts Postgres 15 (config.toml
      # major_version) with the auth schema and roles, then applies
      # supabase/migrations in order. Only the database container starts; the
      # `supabase start -x ...` fallback is not needed on this version.
      # 0019 reads the guardrail HMAC key from Supabase Vault and stops without
      # it, so local-vault.sh adds a throwaway key to config.toml for this one
      # command and puts the file back (the entry is never committed: `db push`
      # would upsert it into production).
      - name: Start the database and apply every migration
        run: bash supabase/scripts/local-vault.sh supabase db start

      # Runs every supabase/tests/*.test.sql through pg_prove. Any failed
      # assertion, plan mismatch, or SQL error fails the job.
      - name: Run the pgTAP suite
        run: supabase test db

  # Production's replay (CTO 11, 2026-09-29). The `sql` job proves the files
  # apply to an empty database; production is not empty and already holds
  # 0001 to 0020 (supabase/production-history.tsv). This job builds exactly
  # that history, loads rows with production's shape, pushes the pending files
  # the way the founder's push will (`db push`, one transaction per file),
  # checks what must hold afterwards, runs the whole pgTAP suite on the result,
  # and compares its schema with one built from empty.
  sql-replay:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.118.0

      # Fails unless every row of production-history.tsv has its file with the
      # pinned hash, then moves every other migration file aside.
      # With nothing pending (every file on main is applied), the steps that
      # load production-shaped rows and check the push's effects sit out;
      # the history build, pgTAP and the schema diff still run. The next
      # push that adds a file brings fixtures for its own rows.
      - name: Set aside the files production has not applied
        id: split
        run: node supabase/scripts/replay-split.mjs split

      - name: Build production's database from its recorded history
        run: bash supabase/scripts/local-vault.sh supabase db start

      - name: Load rows with production's shape
        if: steps.split.outputs.pending != '0'
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/replay/production_rows.sql

      # The CLI prints the list to stderr, hence 2>&1.
      - name: Bring the pending files back; the dry run must list exactly them
        run: |
          node supabase/scripts/replay-split.mjs restore
          supabase db push --local --dry-run --skip-vault 2>&1 | tee "$RUNNER_TEMP/dry-run.txt"
          node supabase/scripts/replay-split.mjs dry-run "$RUNNER_TEMP/dry-run.txt"

      - name: Push the pending files, as production's push will
        run: supabase db push --local --skip-vault --yes

      - name: Check what must hold after the push
        if: steps.split.outputs.pending != '0'
        run: >-
          psql "$DB_URL" -v ON_ERROR_STOP=1
          -v expected_versions="$(node supabase/scripts/replay-split.mjs versions)"
          -f supabase/replay/after_push.sql

      # Every pgTAP file scopes its counts to its own ids, so it runs on a
      # database that is not empty.
      - name: Run the pgTAP suite on the replayed database
        run: supabase test db

      # Both paths apply the same files in the same order, so any difference
      # is a data-dependent branch worth reading.
      - name: The replayed schema equals one built from empty
        run: |
          supabase db dump --local --schema public -f "$RUNNER_TEMP/replayed.sql"
          bash supabase/scripts/local-vault.sh supabase db reset --local
          supabase db dump --local --schema public -f "$RUNNER_TEMP/fresh.sql"
          diff -u "$RUNNER_TEMP/replayed.sql" "$RUNNER_TEMP/fresh.sql"
