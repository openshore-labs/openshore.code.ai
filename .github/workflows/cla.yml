# The contributor license agreement check (CLA.md, 2026-10-11). On a
# pull request from someone who has not signed, it comments with a link to
# CLA.md and the sentence to reply with; the reply records the signature in
# signatures/cla.json on the cla-signatures branch, and the check turns green.
# A maintainer can comment "recheck" to run it again.
#
# pull_request_target runs this file from main with the repository's token,
# never the pull request's code: the action checks out nothing, it only reads
# the pull request's commit authors and writes the signatures file. Pinned to
# a commit SHA, like every action here, so a moved tag cannot swap the code
# that holds that token.
#
# One-time setup: create the cla-signatures branch (any content), and leave
# it unprotected so the action can commit to it.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: github.repository == 'openshore-labs/openshore.code.ai'
    runs-on: ubuntu-latest
    steps:
      - name: Check the CLA
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        # v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/openshore-labs/openshore.code.ai/blob/main/CLA.md
          branch: cla-signatures
          # The maintainers' own account and the account that commits the
          # AI coding sessions' work, so the company's own changes need no
          # contributor sign-off. A pull request from anyone else still does.
          allowlist: dependabot[bot],renovate[bot],openshore-labs,claude
