# Desktop release: build the packaged app for Linux and Windows, prove each
# one's engine boots, and on a version tag attach both to ONE GitHub Release so
# a person can download and run OpenShore without a toolchain, and so the
# desktop app's own auto-updater (electron-updater, wired in electron/main.ts)
# has a feed to check. This is the one workflow that actually launches
# Electron, so unlike ci.yml it lets the Electron binary download and rebuilds
# node-pty against Electron's ABI. Linux and Windows packages need no code
# signing, so there are no secrets here beyond the Supabase build-time values
# already used elsewhere. (macOS is a separate, Codemagic-driven build outside
# this workflow: see codemagic.yaml's mac-desktop job. It ships unsigned by
# founder decision, so it is not part of electron-updater's silent install
# path; the desktop app's update check handles that platform separately.)
#
# Three ways in:
#   - push to main (founder, 2026-09-23: every push to main reaches the
#     desktops) -> the `version` job picks the next patch after the newest
#     v<major>.<minor>.* tag, then build, smoke, AND publish that Release. A
#     desktop that is behind shows its update bar within half an hour
#     (electron/main.ts). Pushes that only touch the iOS project or docs skip.
#   - push a tag like v0.1.0  -> build, smoke, AND publish a Release
#   - run it by hand (Actions -> Release -> Run workflow) -> build and smoke
#     only, so packaging can be proven any time without cutting a release.
#
# Linux and Windows build and smoke-test in parallel; a single `publish` job
# waits for both so the release is created once, atomically, with every
# platform's files together (a person, and electron-updater, always find a
# complete release, never a half-published one).
#
# The toolchain setup (pnpm version, Node from .nvmrc, cache) is kept in sync
# with ci.yml and catalog.yml, and every action is pinned to a commit SHA for
# the same supply-chain reason ci.yml documents.
name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Path filters apply to the branch push only; a tag push always runs.
    paths:
      - "app/**"
      - "os-code/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/release.yml"
      - "!app/ios/**"
      - "!**/*.md"
  workflow_dispatch:

# The publish job creates a GitHub Release, which writes to the repo. Nothing
# else here needs write, and a hand run never reaches the publish job.
permissions:
  contents: write

# One release run per ref at a time, never cancelled mid-publish: pushes that
# land while one runs wait their turn (the newest waiting one wins), and each
# picks its version from the tags as they stand when it starts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The version this run ships, and whether it publishes. A tag names its own
  # version; a push to main takes the next patch after the newest tag in the
  # same major.minor as app/package.json (0.1.x today); a hand run publishes
  # nothing and keeps the committed version.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Pick the version
        id: pick
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            BASE=$(node -p "require('./app/package.json').version")
            MM="${BASE%.*}"
            BASE_PATCH="${BASE##*.}"
            LAST=$(git ls-remote --tags origin \
              | awk '{print $2}' \
              | sed -n "s#^refs/tags/v${MM//./\\.}\\.\([0-9][0-9]*\)\$#\1#p" \
              | sort -n | tail -1)
            NEXT=$(( ${LAST:-$BASE_PATCH} + 1 ))
            if (( NEXT <= BASE_PATCH )); then NEXT=$(( BASE_PATCH + 1 )); fi
            VERSION="${MM}.${NEXT}"
          else
            echo "A hand run publishes nothing; keeping the committed version."
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "This run ships v$VERSION"

  package-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # electron-builder names the AppImage and .deb after app/package.json's own
      # version field, not the git tag, so a tag build has to stamp it or every
      # release ships an identically-named, identically-versioned file. That
      # already happened once (v0.1.0 and v0.1.1 both produced
      # oscode-app_0.1.0_amd64.deb): apt/dpkg compare package versions to decide
      # whether to overwrite on `apt install ./file.deb`, so an unchanged version
      # number can make a real update look like "already the newest version" and
      # silently not install. It also feeds electron-updater directly: the
      # version this build stamps is the version its own update-metadata YAML
      # advertises. A manual (workflow_dispatch) run has no tag to derive a
      # version from, so it leaves the committed version alone.
      - name: Stamp the app version
        if: needs.version.outputs.version != ''
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          (cd app && npm pkg set version="$VERSION")
          echo "Stamped app/package.json version to $VERSION"

      # xvfb gives the headless runner a display for the smoke launch; the other
      # libraries are Electron's runtime shared-object deps, which the sandbox
      # runner does not all carry by default. Installing them here keeps the
      # smoke launch from failing for a reason that has nothing to do with the
      # package.
      - name: Install a display and Electron's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1

      # Unlike CI, this workflow launches Electron, so let the binary download
      # and let the native rebuild run. The install script and postinstall honor
      # the absence of the skip flags.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the engine
        run: pnpm --filter os-code build

      # VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are Vite build-time values
      # (baked into the bundle by `import.meta.env`, never read at runtime), so
      # they have to be present at THIS step, not after packaging. With both
      # unset, sign-in simply does not render (app/src/lib/supabase.ts) and the
      # rest of the app is unaffected, exactly as the iOS build behaves before
      # its own copy of these two repository secrets is set. To make sign-in
      # work on this build, add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as
      # repository secrets (Settings -> Secrets and variables -> Actions), using
      # the same values as the app's own Supabase project (Settings -> API) or
      # the iOS build's Codemagic variable group.
      - name: Build the app (web bundle and Electron main)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm --filter oscode-app build

      # node-pty is a native module compiled for Node's ABI on install; the
      # packaged app runs Electron's ABI, so it must be rebuilt or the engine
      # cannot open a terminal. `-m ../os-code` points the rebuild at where the
      # engine actually resolves node-pty in the pnpm workspace.
      - name: Rebuild native modules for Electron
        run: pnpm --filter oscode-app rebuild:native

      # electron-builder itself, without the leading vite/tsc that package:linux
      # runs (already done above). --publish never keeps it from touching GitHub;
      # the publish here is a separate, explicit job below, shared with Windows.
      # It still writes latest-linux.yml locally (electron-updater's feed file
      # for the AppImage target) regardless of --publish never; only the upload
      # is skipped.
      - name: Package the Linux AppImage and deb
        run: pnpm --filter oscode-app exec electron-builder --linux --publish never

      # The proof that matters: launch the packaged app headless and confirm the
      # workspace-linked engine actually boots inside the bundle. A green unit
      # suite cannot show this; only running the package can.
      - name: Smoke test the packaged app
        run: xvfb-run -a pnpm --filter oscode-app exec node scripts/package-smoke.mjs

      - name: Upload the packages as build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openshore-linux
          path: |
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.blockmap
            app/release/latest-linux.yml
          if-no-files-found: error

  package-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Same reasoning as the Linux job's identical step; `shell: bash` because
      # the script uses bash parameter expansion and the runner's default shell
      # on Windows is PowerShell. GitHub's windows-latest image ships Git for
      # Windows, which is where this bash comes from.
      - name: Stamp the app version
        if: needs.version.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          (cd app && npm pkg set version="$VERSION")
          echo "Stamped app/package.json version to $VERSION"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the engine
        run: pnpm --filter os-code build

      - name: Build the app (web bundle and Electron main)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm --filter oscode-app build

      # Same native-module problem as Linux: node-pty is built for Node's ABI on
      # install and must be rebuilt for Electron's. windows-latest carries the
      # MSVC build tools @electron/rebuild's node-gyp step needs; this is the
      # first time this rebuild has run on Windows in CI, so a failure here
      # points at that toolchain, not at the source.
      - name: Rebuild native modules for Electron
        run: pnpm --filter oscode-app rebuild:native

      # No code signing (see the file header): electron-builder produces a
      # working but unsigned NSIS installer. Windows SmartScreen will warn on
      # first run until this is signed; that is a founder call for later, not
      # a blocker for the package existing. Still writes latest.yml locally
      # (electron-updater's Windows feed file) even under --publish never.
      - name: Package the Windows installer
        run: pnpm --filter oscode-app exec electron-builder --win --publish never

      # The same proof as Linux, reused as-is: launch the packaged app headless
      # (windows-latest runners carry a real interactive desktop session, so
      # this needs no xvfb-equivalent) and confirm the bundled engine boots.
      # package-smoke.mjs only auto-finds the Linux unpacked binary, so the
      # Windows one is passed explicitly.
      - name: Smoke test the packaged app
        run: pnpm --filter oscode-app exec node scripts/package-smoke.mjs release/win-unpacked/OpenShore.exe

      - name: Upload the packages as build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openshore-windows
          path: |
            app/release/*.exe
            app/release/*.blockmap
            app/release/latest.yml
          if-no-files-found: error

  # A tag or a push to main publishes; a hand run does not. Waits for both platforms so the release is created
  # once, complete, rather than Linux and Windows racing to create/upload onto
  # the same tag separately. `gh` is first-party and preinstalled on the
  # runner, so no third-party release action is trusted with the write token.
  publish:
    needs: [version, package-linux, package-windows]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download the Linux packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openshore-linux
          path: release

      - name: Download the Windows packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openshore-windows
          path: release

      # A push to main has no tag yet: --target creates it on this exact commit.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "OpenShore $TAG" \
            --generate-notes \
            release/*

      # The Mac build runs on Codemagic (codemagic.yaml, mac-desktop) and
      # uploads into the newest release, which is this one. Starting it here
      # means Macs get every release too. Optional: with the two repository
      # secrets unset this step says so and skips, and Macs keep updating to
      # the newest release that has a Mac build (electron/main.ts looks for
      # one). Set CODEMAGIC_API_TOKEN (Codemagic, Teams, Integrations,
      # Codemagic API) and CODEMAGIC_APP_ID (the app's id in its Codemagic
      # URL) to turn it on; see docs/MAC-DESKTOP.md.
      - name: Start the macOS build on Codemagic
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CODEMAGIC_APP_ID: ${{ secrets.CODEMAGIC_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CODEMAGIC_API_TOKEN:-}" ] || [ -z "${CODEMAGIC_APP_ID:-}" ]; then
            echo "CODEMAGIC_API_TOKEN or CODEMAGIC_APP_ID is not set; skipping the Mac build."
            exit 0
          fi
          BODY=$(printf '{"appId":"%s","workflowId":"mac-desktop","branch":"main"}' "$CODEMAGIC_APP_ID")
          curl -fsS -X POST https://api.codemagic.io/builds \
            -H "Content-Type: application/json" \
            -H "x-auth-access-token: ${CODEMAGIC_API_TOKEN}" \
            -d "$BODY" \
            || echo "Could not start the Codemagic Mac build; Macs stay on the newest release with a Mac build."
