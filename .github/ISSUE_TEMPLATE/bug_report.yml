name: Bug report
description: Something does not work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. osc init
        2. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - osc CLI
        - Desktop app
        - iPhone app
        - Docking (phone to computer or server)
        - Marketplace
        - Other
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, OpenShore or osc version, model server (Ollama, llama.cpp, ...) and the model. `osc doctor` output helps.
      render: text
  - type: markdown
    attributes:
      value: A security problem? Do not file it here. See SECURITY.md.
