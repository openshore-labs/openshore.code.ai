<!-- The OpenShore sign-in email (supabase/config.toml: magic_link and
     confirmation). No passwords: the code is the way in from any device, the
     link the shortcut on the device that asked. The link goes through
     https://openshore.ai/sign-in/continue/ with the real address in the
     fragment, so a mail scanner never reaches the auth server. GoTrue renders
     this with Go's html/template, which percent-encodes the address there by
     context (no urlquery needed). No images, no tracking. -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 480px; color: #0b1417;">
  <p style="font-size: 16px;">Your OpenShore sign-in code:</p>
  <p style="font-size: 32px; font-weight: 600; letter-spacing: 6px; margin: 8px 0 20px;">{{ .Token }}</p>
  <p style="font-size: 15px;">Type it into OpenShore on any device. It works for 10 minutes, once.</p>
  <p style="font-size: 15px;">
    On the device that asked, you can
    <a href="https://openshore.ai/sign-in/continue/#u={{ .ConfirmationURL }}">sign in with this link</a>
    instead.
  </p>
  <p style="font-size: 13px; color: #4a5a5f;">
    If you did not ask to sign in, ignore this email. Nobody can sign in without this code or link.
  </p>
</div>
