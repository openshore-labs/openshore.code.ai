# Supabase project config for OS Code. `project_id` is a local name; the remote
# project is bound by `supabase link --project-ref <ref>`. Redirect URLs list
# every origin a magic-link sign-in may return to (also set these in the hosted
# project's Auth settings).
#
# Email confirmations are ON and must stay on (review 2026-09-05, P0-4). Every
# email-keyed grant (claim_membership, project_level, set_org_project_access)
# trusts the JWT email claim; with confirmations off, anyone who signs up with a
# victim's address gets a session carrying that email and inherits the victim's
# invited seats, admin role included. The newer CLI's `supabase config push`
# mirrors [auth] from this file to the hosted project, so a local "false" here
# would reach production by one habitual command. Migration 0015 adds a SQL
# belt-and-braces (email_confirmed_at must be set) so the hole stays closed even
# if the dashboard toggle drifts.
project_id = "os-code"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "oscode://auth-callback",
  "http://127.0.0.1:4817/auth-callback",
  "http://localhost:5173/auth-callback",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Never set this to false, even locally: see the header note (P0-4).
enable_confirmations = true
# Sign-in without passwords (founder, CTO 2026-10-12): one email carries a
# 6-digit code and a PKCE link, the code living 10 minutes and one email a
# minute. The verify limit is per IP only, so a guesser spread over many
# addresses is not stopped by it; the CTO accepted that residual risk for now
# (DECISIONS 2026-10-12) rather than move to 8 digits. The app reads the
# same numbers (app/src/state/emailSignInOps.ts: PENDING_AUTH_TTL_MS,
# RESEND_WAIT_S, CODE_LENGTH), and app/test/passwordless.test.ts holds them
# equal.
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

# The one template for a sign-in, a new account's first one included: the
# code first and large, then a link through the scanner-safe page on
# openshore.ai (/sign-in/continue/, in OpenShore.ai-marketing-site), so a mail
# scanner that opens the link cannot use up the token the code shares.
[auth.email.template.magic_link]
subject = "Your OpenShore sign-in code"
content_path = "./supabase/templates/sign-in.html"

[auth.email.template.confirmation]
subject = "Your OpenShore sign-in code"
content_path = "./supabase/templates/sign-in.html"

# There are no passwords, but GoTrue's /recover still answers any caller: its
# email says so and carries no link or code (CTO review, 2026-10-12).
[auth.email.template.recovery]
subject = "OpenShore has no passwords"
content_path = "./supabase/templates/no-password.html"

# Passkeys (GoTrue's own, CTO 2026-10-12): the relying party is openshore.ai,
# and only a native iOS ceremony (or a real browser on openshore.ai) can match
# it. Production values. Off until
# the founder's gate in docs/passwordless-runbook.md holds (0028's step-up
# trigger is on auth.webauthn_credentials, the Apple association file is
# served); the app's own switch is VITE_PASSKEYS.
[auth.passkey]
enabled = false

[auth.webauthn]
rp_display_name = "OpenShore"
rp_id = "openshore.ai"
rp_origins = ["https://openshore.ai"]

# Note: claim_membership is a Postgres RPC (SECURITY DEFINER function), not an
# edge function, so it has no [functions.*] entry here.

[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-portal]
verify_jwt = true

# The Stripe webhook is called by Stripe, not a signed-in user, so no JWT.
[functions.stripe-webhook]
verify_jwt = false

# A signed-in user deletes their own account (Apple 5.1.1(v)). The caller's JWT
# is required; the function resolves who they are from it with auth.getUser()
# and never from the request body.
[functions.delete-account]
verify_jwt = true

# Repo OAuth (GitHub, GitLab, Bitbucket). The provider redirect cannot carry a
# Supabase bearer, and /exchange requires a valid single-use provider code, so
# no JWT. The provider client secret lives only in this function's secrets.
[functions.repo-oauth]
verify_jwt = false

# A signed-in user registers their own APNs device token, so the caller's JWT is
# required. The service role does the actual write (RLS denies client writes).
[functions.push-register]
verify_jwt = true

# A signed-in user mints a push-capability grant for their desktop daemon, so the
# caller's JWT is required.
[functions.push-grant]
verify_jwt = true

# The desktop daemon calls push-send with an opaque grant, not a user JWT, so no
# JWT here; trust comes from the grant, which resolves the target user and
# devices server-side (never from the request body).
[functions.push-send]
verify_jwt = false

# The Stripe checkout return page. The browser lands here after payment, with no
# user JWT, so it serves plain HTML that deep-links back into the app. It reads
# no secrets and writes nothing.
[functions.checkout-return]
verify_jwt = false
