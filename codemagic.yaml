# OpenShore: iOS build to TestFlight.
# One-time setup lives in docs/TESTFLIGHT.md (App Store Connect app record,
# Codemagic App Store Connect API-key integration named "os_code_app_store").
workflows:
  ios-testflight:
    name: OpenShore iOS (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: os_code_app_store
    environment:
      # Node >= 22.12.0 is required: Capacitor 8's CLI needs >= 22, and the
      # rolldown darwin-arm64 native binding (vite 8's bundler) declares
      # engines node ">=22.12.0", so 22.11 makes pnpm silently skip that
      # binding and the vite build dies with "Cannot find native binding".
      # Pinned to 22.22.2 to match the version the lockfile was built on.
      node: 22.22.2
      # Pinned, not `latest`: a new Xcode landing on the build image was the
      # one thing that could change a green pipeline into a red one with no
      # commit here. Bump this deliberately, after a green build on the new
      # version. 26.3 is the newest Xcode 26 release the pin could be verified
      # against when it was set (2026-09-05; the last green build's log was not
      # reachable from that session). Deployment target is iOS 16.0, which
      # every Xcode 26 supports.
      xcode: 26.3
      # Import the variable group that holds CERTIFICATE_PRIVATE_KEY (the
      # persisted iOS signing key). Without this line the group's secrets are
      # not exposed to the build and the signing step falls back to a one-off
      # key. The group is named in the Codemagic UI (Team/App -> Environment
      # variables).
      groups:
        - Harbor-os-code
      vars:
        BUNDLE_ID: ai.openshore.oscode
        # An iOS build never launches Electron. Skip the Electron binary
        # download in the electron package's install script, and skip the
        # electron-rebuild of node-pty in the app's postinstall
        # (app/scripts/postinstall.mjs honors this guard). Both only serve the
        # desktop, and both cost minutes on every TestFlight build.
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        SKIP_NATIVE_REBUILD: "1"
      # Manual signing. No `ios_signing:` block (that is automatic signing,
      # which only FETCHES profiles here and cannot mint the cert on a fresh
      # account, hence "No matching profiles found"). The "Set up code
      # signing" step creates the distribution certificate FROM a supplied
      # private key, which is the piece the earlier attempts were missing.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install workspace dependencies
        script: |
          set -euo pipefail
          # The build image pre-enables corepack, so the `pnpm` on PATH is a
          # corepack shim. That shim self-provisions pnpm through corepack,
          # whose bundled npm registry signing keys are stale, and dies with
          # "Cannot find matching keyid". Disable the shims first, then the
          # real pnpm we install with npm is what actually runs. Belt and
          # suspenders: also tell corepack to skip signature checks in case a
          # shim slips through.
          export COREPACK_INTEGRITY_KEYS=0
          corepack disable || true
          npm install -g pnpm@10.33.0
          pnpm --version
          pnpm install --frozen-lockfile
      - name: Gate the build on the test suite
        script: |
          set -euo pipefail
          # The GitHub CI on main and this TestFlight pipeline were two
          # independent triggers on the same branch: a red suite could still
          # ship to TestFlight because Codemagic never ran the tests. Gate the
          # build on the same checks a contributor runs locally, so broken code
          # can never reach a tester. os-code must build first (the app imports
          # its compiled protocol types).
          pnpm --filter os-code build
          pnpm -r lint
          pnpm -r typecheck
          pnpm -r test
      - name: Build the web app, sync the iOS project
        script: |
          set -euo pipefail
          # The engine dist is already built by the gate step above; this step
          # only bundles the web app against it.
          cd app
          npx vite build
          npx cap sync ios
      - name: Stamp the build number
        script: |
          set -euo pipefail
          # Codemagic's own build index. It increments once per build on this
          # app, forever, so it is already monotonic and always ahead of what
          # Apple has on record. This line shipped ~62 builds to TestFlight
          # without a single duplicate.
          #
          # History, so nobody "fixes" this again: on 2026-09-03 a publish
          # failed for an unrelated reason (ITMS-90474, the iPad orientation
          # keys, fixed in Info.plist) and this step was rewritten twice on a
          # guess. The first rewrite queried Apple for the latest TestFlight
          # build number and stamped LATEST + 1, which is exactly how a
          # duplicate gets created: a build still processing is not yet the
          # "latest," so the query returns the one before it and LATEST + 1
          # lands on a number already taken. That rewrite caused the duplicate
          # it was meant to prevent. The second rewrite stamped a UTC timestamp,
          # which is monotonic but a one-way door: once a ~1.8 billion build
          # number is on record, every future build has to beat it forever.
          # Neither was needed. Do not replace this with a query to Apple.
          echo "Stamping build number $BUILD_NUMBER (Codemagic build index)."
          cd app/ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          # A fresh Apple account has no distribution certificate, and a
          # distribution cert's private key is never downloadable. Provide a
          # private key so fetch-signing-files can CREATE the certificate from
          # it (the missing piece before), then create the App Store profile.
          # The key is PERSISTED as the encrypted env var CERTIFICATE_PRIVATE_KEY
          # (Team -> env vars, secure), so the same distribution certificate is
          # reused every build instead of minting a new one each run (Apple
          # caps how many you can have). Falls back to a fresh one-off key only
          # if that var is not set yet, so this cannot break a build before you
          # have pasted it in. See docs/TESTFLIGHT.md.
          KEY=/tmp/oscode_signing_key
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" > "$KEY"
          else
            echo "WARNING: CERTIFICATE_PRIVATE_KEY is not set. Generating a one-off key," \
                 "which mints a NEW distribution certificate this run. Apple caps how many" \
                 "you can have. Set CERTIFICATE_PRIVATE_KEY (see docs/TESTFLIGHT.md) before" \
                 "your next build."
            openssl genrsa -out "$KEY" 2048
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:"$KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "app/ios/App/App.xcodeproj"
      - name: Build the signed IPA
        script: |
          set -euo pipefail
          # The OscodeLlama plugin depends on LLM.swift, which is macro-based
          # (swift-syntax + a compiler-plugin target) and also pulls the
          # swift-docc build plugin. In a headless xcodebuild archive there is
          # no GUI to "Trust & Enable" those, so Xcode refuses at
          # ComputeTargetDependencyGraph. Skipping the validation gates is the
          # standard way to build macro/plugin SPM packages in CI.
          xcode-project build-ipa \
            --project app/ios/App/App.xcodeproj \
            --scheme App \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO -skipMacroValidation -skipPackagePluginValidation"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload the build to App Store Connect but do NOT auto-submit it for
        # EXTERNAL TestFlight beta review. Internal testers automatically
        # receive every uploaded build with no review and no Beta App
        # Information form, so this gets it to your own phone cleanly.
        # To enable external testers later: fill in the Beta App Information
        # + Beta App Review contact details in App Store Connect, then set
        # this back to `true` (optionally add `beta_groups: [<group name>]`).
        submit_to_testflight: false

  # macOS desktop build: an unsigned .dmg and .zip (arm64 and x64) distributed
  # straight from openshore.ai, the same way the Uki Music desktop app ships,
  # never through the Mac App Store. Needs no Apple Developer certificate and
  # no notarization credentials. The tradeoff, in full: the first time
  # someone opens it, Gatekeeper shows "Apple could not verify this app is free
  # of malware," and they right-click the app and choose Open (once) instead of
  # a plain double-click; every launch after that is normal. electron-builder
  # signs it ad-hoc automatically (required for the app to even launch on
  # Apple Silicon, unrelated to Gatekeeper), which needs no certificate either.
  # Details and the exact download-page copy to pair with this are in
  # docs/MAC-DESKTOP.md, including the one OPTIONAL secret (GH_RELEASE_TOKEN)
  # that publishes the build to the same GitHub Release Linux and Windows use
  # (release.yml); without it this job still succeeds and the dmg/zip are
  # still Codemagic build artifacts, just not on GitHub.
  mac-desktop:
    name: OpenShore macOS (desktop, unsigned)
    max_build_duration: 90
    instance_type: mac_mini_m2
    # No `triggering:` block on purpose. This runs on demand from the Codemagic
    # UI (or the API), never on every push to main, so it does not spend Mac
    # minutes on iOS-bound commits.
    environment:
      # Match the version the lockfile was built on, same as the iOS workflow.
      node: 22.22.2
      groups:
        # The same group the iOS workflow imports, so the desktop build gets the
        # same VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY (sign-in works here the
        # same way it works on the iOS build) and any other VITE_-prefixed build
        # value already set there. Its CERTIFICATE_PRIVATE_KEY (iOS-only) is
        # simply unused here. This group already exists, so this workflow needs
        # no new Codemagic setup at all.
        - Harbor-os-code
    scripts:
      - name: Determine and stamp the release version
        script: |
          set -euo pipefail
          # This job has no `triggering:` block (see above) and so no git tag to
          # read a version from the way release.yml's Linux/Windows jobs do: it
          # runs on demand. Without this step, app.getVersion() keeps reporting
          # whatever is committed in app/package.json forever (proven: that
          # field has never changed from "0.1.0" across two real tags, v0.1.0
          # and v0.1.1), which breaks the desktop app's own macOS update check
          # (checkMacUpdate in app/electron/main.ts): it would show "Update
          # available" permanently, even right after installing the actual
          # latest release. So this build always targets and stamps whatever
          # GitHub Release is currently latest, the exact same one it uploads
          # into below (MAC_RELEASE_TAG, exported once here so both steps agree
          # by construction rather than by two separate lookups). Run the
          # Linux/Windows release first (push a v* tag) so there is one.
          #
          # A public repo's release list is readable with no token, so this
          # only needs gh itself, not GH_RELEASE_TOKEN. Anything that keeps it
          # from resolving a tag (no gh, no releases yet, a network hiccup)
          # warns and leaves the committed version alone rather than failing
          # the build; the macOS update check may misreport until it is fixed,
          # but the build and its Codemagic artifacts are unaffected.
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh (GitHub CLI) is not on this image, so the release version" \
                 "cannot be looked up. Packaging with whatever version is" \
                 "committed in app/package.json."
            exit 0
          fi
          if ! LATEST_TAG=$(gh release view --repo openshore-labs/openshore.code.ai \
            --json tagName -q .tagName 2>&1); then
            echo "Could not look up the latest GitHub release: $LATEST_TAG"
            echo "Packaging with whatever version is committed in app/package.json."
            exit 0
          fi
          VERSION="${LATEST_TAG#v}"
          (cd app && npm pkg set version="$VERSION")
          echo "Stamped app/package.json version to $VERSION (from $LATEST_TAG)"
          echo "MAC_RELEASE_TAG=$LATEST_TAG" >> "$CM_ENV"
      - name: Install workspace dependencies
        script: |
          set -euo pipefail
          # Same corepack/pnpm dance the iOS workflow documents: the image's
          # corepack pnpm shim dies on stale registry keys, so disable it and
          # run the pnpm we install with npm.
          export COREPACK_INTEGRITY_KEYS=0
          corepack disable || true
          npm install -g pnpm@10.33.0
          pnpm --version
          pnpm install --frozen-lockfile
      - name: Gate the build on the test suite
        script: |
          set -euo pipefail
          # Ship only known-good code, the same gate the iOS workflow runs. The
          # engine builds first because the app imports its compiled types.
          pnpm --filter os-code build
          pnpm -r lint
          pnpm -r typecheck
          pnpm -r test
      - name: Build the app (web bundle and Electron main)
        script: |
          set -euo pipefail
          pnpm --filter oscode-app build
      - name: Rebuild native modules for Electron
        script: |
          set -euo pipefail
          # node-pty is compiled for Node's ABI on install; the packaged app
          # runs Electron's ABI, so it must be rebuilt or the terminal cannot
          # open. The headers download from electronjs.org, reachable here.
          pnpm --filter oscode-app rebuild:native
      - name: Package the macOS app
        script: |
          set -euo pipefail
          # No CSC_LINK is set, so electron-builder finds no Developer ID
          # certificate and signs ad-hoc on its own (the identity Apple Silicon
          # requires just to launch a binary at all). No notarization step: the
          # app is genuinely unsigned in Apple's eyes, hence the one-time
          # Gatekeeper right-click the top-of-file comment describes. --publish
          # never keeps electron-builder from touching GitHub; the artifacts
          # are collected below.
          cd app
          pnpm exec electron-builder --mac --publish never
      - name: Publish to the GitHub Release
        script: |
          set -euo pipefail
          # nullglob: if any one pattern below matches nothing (say, a build
          # that skips the blockmap), it drops out of the argument list instead
          # of being passed to `gh` as a literal, nonexistent filename.
          shopt -s nullglob
          # See docs/MAC-DESKTOP.md for the one-time setup. Codemagic's own
          # GitHub integration is read-only clone access, not an API token, so
          # publishing needs GH_RELEASE_TOKEN: a fine-grained PAT scoped to just
          # this repo with Contents: Read and write. Reuses MAC_RELEASE_TAG from
          # the stamp step above instead of looking the tag up again, so the
          # version this build reports and the release it uploads into can
          # never drift apart. A missing tag, a missing token, or a missing gh
          # CLI all skip rather than fail: the dmg/zip are already safe as
          # Codemagic's own artifacts (below) either way, so this step warns
          # and exits clean rather than turning an optional step into a hard
          # failure.
          if [ -z "${MAC_RELEASE_TAG:-}" ]; then
            echo "No release version was resolved earlier in this build (see the" \
                 "'Determine and stamp the release version' step). Skipping the" \
                 "GitHub Release publish. The dmg/zip are still attached as" \
                 "Codemagic artifacts on this build."
            exit 0
          fi
          if [ -z "${GH_RELEASE_TOKEN:-}" ]; then
            echo "GH_RELEASE_TOKEN is not set. Skipping the GitHub Release publish;" \
                 "see docs/MAC-DESKTOP.md to enable it. The dmg/zip are still" \
                 "attached as Codemagic artifacts on this build."
            exit 0
          fi
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh (GitHub CLI) is not on this image, so the GitHub Release" \
                 "publish step is skipped. The dmg/zip are still attached as" \
                 "Codemagic artifacts on this build."
            exit 0
          fi
          export GH_TOKEN="$GH_RELEASE_TOKEN"
          cd app
          LATEST_TAG="$MAC_RELEASE_TAG"
          echo "Publishing the macOS build to $LATEST_TAG"
          gh release upload "$LATEST_TAG" --repo openshore-labs/openshore.code.ai \
            --clobber release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml
    artifacts:
      - app/release/*.dmg
      - app/release/*.zip
      - app/release/*.blockmap
      - app/release/latest-mac.yml
