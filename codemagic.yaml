# OS Code: iOS build to TestFlight.
# One-time setup lives in docs/TESTFLIGHT.md (App Store Connect app record,
# Codemagic App Store Connect API-key integration named "os_code_app_store").
workflows:
  ios-testflight:
    name: OS Code iOS (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: os_code_app_store
    environment:
      node: 20.19.4
      xcode: latest
      vars:
        BUNDLE_ID: ai.openshore.oscode
      # No `ios_signing:` block here on purpose. That block is Codemagic's
      # AUTOMATIC signing, which runs at environment setup (before scripts).
      # It cannot coexist with the manual CLI signing in the scripts below;
      # mixing the two is what raised "No matching profiles found" on every
      # run, and it failed before our script steps ever executed. Signing is
      # owned entirely by the "Set up code signing" step.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install workspace dependencies
        script: |
          # corepack reads the root package.json "packageManager" field to
          # pick pnpm@10.33.0. Without that field it walks up to the build
          # machine's ~/package.json (which pins yarn) and refuses to run.
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build the engine and the web app, sync the iOS project
        script: |
          pnpm --filter os-code build
          cd app
          npx vite build
          npx cap sync ios
      - name: Stamp the build number
        script: |
          cd app/ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build the signed IPA
        script: |
          xcode-project build-ipa \
            --project app/ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
