<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f6f4ef" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!--
      One CSP for both shells (Electron window and the iOS WebView). Scripts
      only from the bundle; connect-src stays open because the phone talks to
      the desktop daemon on Tailscale IPs and to providers the user connects.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src *"
    />
    <title>OpenShore</title>
    <!--
      Boot splash. Painted the instant the document parses, before the bundle
      loads and React mounts, so opening OpenShore never shows a blank window
      (desktop Electron) or the gap between the iOS launch image and the first
      React frame. Deliberately unhurried, modeled on the Claude iOS app's
      opening: the mark scales and fades in, HOLDS for a beat (main.tsx enforces
      a minimum on-screen time so it never flashes past on a fast device), then
      the whole splash scales through and cross-fades as the app arrives.

      Timing knobs live in two places, tune both together:
        - entrance + exit durations/curves here in this <style>
        - SPLASH_MIN_MS (the hold) in src/main.tsx
      Inline styles are allowed by the CSP's style-src 'unsafe-inline'.
    -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        /* Horizontal lockup: wave-mark tile beside the wordmark, on one row,
           the same two-part shape as the in-app greeting. */
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f6f4ef;
        opacity: 1;
        transform: scale(1);
        /* Exit: the whole lockup eases up and dissolves as the app appears. */
        transition:
          opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #boot-splash.boot-splash-hidden {
        opacity: 0;
        transform: scale(1.05);
        pointer-events: none;
      }
      #boot-splash .boot-mark {
        width: 56px;
        height: 56px;
        /* Entrance: scale + fade in, easeOutQuint. `backwards` fill holds the
           from-state during any delay and reverts to the natural scale(1)
           after, so it never fights the container's exit transform. */
        animation: boot-rise 0.62s cubic-bezier(0.22, 1, 0.36, 1) backwards;
      }
      #boot-splash .boot-wordmark {
        /* The greeting's display serif (Fraunces), mirrored here so the splash
           and the in-app greeting read as one wordmark. Fraunces is loaded via
           @font-face in theme.css (font-display: swap), so this falls back to
           Georgia for the first paint and swaps in when the bundle's CSS lands,
           the same behavior as the greeting. */
        font-family: 'Fraunces', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
        font-weight: 500;
        /* font-size: 0 on the container so the whitespace between the letter
           spans (each on its own line in the markup) collapses to zero width.
           The real size lives on the letters. */
        font-size: 0;
        letter-spacing: 0.02em;
        color: #1c2a33;
      }
      #boot-splash .boot-wordmark .boot-accent {
        color: #2f5a66;
      }
      /* The wordmark surfaces one letter at a time, animated on the classic
         character-animation principles so it reads hand-keyed, not tweened:
         squash and stretch (the letter elongates as it pushes through the
         surface, then squashes flat when it lands, volume roughly conserved),
         anticipation (a faint ring bulges the water just before it emerges),
         and follow-through (a damped two-beat bob before rest). The transform
         origin sits at the waterline so the squash plants on the surface the
         way a bouncing ball plants on the ground. --i drives the per-letter
         stagger; --dir alternates the tilt so no two letters move in lockstep.
         `backwards` holds each letter below the surface until its turn. The
         run finishes near 1.7s, inside the 2.0s hold. */
      #boot-splash .boot-wordmark .boot-letter {
        position: relative;
        display: inline-block;
        font-size: 36px;
        letter-spacing: 0.02em;
        transform-origin: 50% 90%;
        animation: boot-letter-float 0.95s ease-out backwards;
        animation-delay: calc(0.12s + var(--i) * 0.08s);
        will-change: transform, opacity, filter;
      }
      /* Two water rings per letter, foreshortened (wider than tall) so they
         read as lying on a horizontal surface, staggered off the same --i as
         the float. The first is ANTICIPATION: a small faint ring that bulges
         the water just before the letter emerges, telegraphing where it will
         break through. The second is the BREAK: a bigger, brighter ring thrown
         outward as the letter actually pierces the surface, fading while the
         letter bobs to rest. */
      #boot-splash .boot-wordmark .boot-letter::before,
      #boot-splash .boot-wordmark .boot-letter::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 0.05em;
        border: 0.045em solid #2f5a66;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-wordmark .boot-letter::before {
        width: 0.5em;
        height: 0.19em;
        margin-left: -0.25em;
        animation: boot-ripple-pre 0.55s ease-out forwards;
        animation-delay: calc(0.42s + var(--i) * 0.08s);
      }
      #boot-splash .boot-wordmark .boot-letter::after {
        width: 0.85em;
        height: 0.31em;
        margin-left: -0.425em;
        animation: boot-ripple 0.9s ease-out forwards;
        animation-delay: calc(0.66s + var(--i) * 0.08s);
      }
      @keyframes boot-ripple-pre {
        0% {
          opacity: 0;
          transform: scale(0.4);
        }
        30% {
          opacity: 0.28;
        }
        100% {
          opacity: 0;
          transform: scale(1.25);
        }
      }
      @keyframes boot-ripple {
        0% {
          opacity: 0;
          transform: scale(0.35);
        }
        16% {
          opacity: 0.5;
        }
        100% {
          opacity: 0;
          transform: scale(2);
        }
      }
      /* Secondary action: on a few star letters a droplet is flung up off the
         pop, decelerates to its apex, then falls back under gravity and winks
         out at the surface. --dx picks the throw direction. Restraint on
         purpose: a gag on every letter stops reading as a gag. */
      #boot-splash .boot-wordmark .boot-drop {
        position: absolute;
        left: 50%;
        bottom: 0.12em;
        width: 0.09em;
        height: 0.09em;
        margin-left: -0.045em;
        border-radius: 50%;
        background: #2f5a66;
        opacity: 0;
        pointer-events: none;
        animation: boot-drop 0.6s linear forwards;
        animation-delay: calc(0.68s + var(--i) * 0.08s);
      }
      #boot-splash .boot-wordmark .boot-drop.boot-drop-b {
        width: 0.06em;
        height: 0.06em;
        margin-left: -0.03em;
        animation-duration: 0.5s;
        animation-delay: calc(0.74s + var(--i) * 0.08s);
      }
      @keyframes boot-drop {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(1);
          animation-timing-function: ease-out;
        }
        12% {
          opacity: 0.85;
        }
        45% {
          /* Apex: eased out on the way up, eased in on the way down. */
          transform: translate(calc(var(--dx, 1) * 0.24em), -0.78em) scale(0.85);
          animation-timing-function: ease-in;
        }
        88% {
          opacity: 0.7;
        }
        100% {
          opacity: 0;
          transform: translate(calc(var(--dx, 1) * 0.4em), 0.02em) scale(0.7);
        }
      }
      /* scale(x, y) is deliberately non-uniform throughout: the letter drifts
         up compressed, elongates as it strains through the surface tension,
         pops through stretched tall, then squashes wide when it lands on the
         waterline, with volume roughly conserved at every key. Fall segments
         switch to ease-in so gravity reads. */
      @keyframes boot-letter-float {
        0% {
          opacity: 0;
          transform: translateY(1em) scale(0.94, 0.88) rotate(calc(var(--dir, 1) * -2.4deg));
          filter: blur(8px);
          color: #2f5a66;
        }
        32% {
          opacity: 1;
        }
        52% {
          /* Nearing the surface: starting to stretch against the tension. */
          transform: translateY(0.22em) scale(0.97, 1.05) rotate(calc(var(--dir, 1) * -1deg));
          filter: blur(2px);
        }
        64% {
          /* The pop: through the surface, stretched tall and clean. */
          transform: translateY(-0.13em) scale(0.9, 1.17) rotate(calc(var(--dir, 1) * 1.4deg));
          filter: blur(0);
          animation-timing-function: ease-in;
        }
        76% {
          /* Lands and squashes wide on the waterline. */
          transform: translateY(0.035em) scale(1.09, 0.91) rotate(calc(var(--dir, 1) * -0.8deg));
        }
        87% {
          /* Rebound, most of the energy spent. */
          transform: translateY(-0.03em) scale(0.98, 1.035) rotate(calc(var(--dir, 1) * 0.3deg));
          animation-timing-function: ease-in;
        }
        94% {
          transform: translateY(0.008em) scale(1.012, 0.99) rotate(0deg);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1, 1) rotate(0deg);
          filter: blur(0);
        }
      }
      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: scale(0.86);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash,
        #boot-splash .boot-mark,
        #boot-splash .boot-wordmark,
        #boot-splash .boot-wordmark .boot-letter {
          animation: none;
          transition: opacity 0.3s linear;
          transform: none;
          opacity: 1;
        }
        #boot-splash .boot-wordmark .boot-letter::before,
        #boot-splash .boot-wordmark .boot-letter::after,
        #boot-splash .boot-wordmark .boot-drop {
          animation: none;
          opacity: 0;
        }
        #boot-splash.boot-splash-hidden {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="img" aria-label="OpenShore">
      <svg class="boot-mark" viewBox="0 0 32 32" focusable="false" aria-hidden="true">
        <rect width="32" height="32" rx="7.5" fill="#1c2a33" />
        <g transform="translate(0 -0.81)">
          <line
            x1="7"
            y1="13"
            x2="25"
            y2="13"
            stroke="#f6f4ef"
            stroke-width="2"
            stroke-linecap="round"
          />
          <path
            d="M7 19q4.5-3.3 9 0t9 0"
            fill="none"
            stroke="#4b90a3"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>
      </svg>
      <div class="boot-wordmark" aria-hidden="true">
        <span class="boot-letter" style="--i: 0; --dir: 1"
          >O<i class="boot-drop" style="--dx: -1"></i
          ><i class="boot-drop boot-drop-b" style="--dx: 1"></i
        ></span>
        <span class="boot-letter" style="--i: 1; --dir: -1">p</span>
        <span class="boot-letter" style="--i: 2; --dir: 1">e</span>
        <span class="boot-letter" style="--i: 3; --dir: -1">n</span>
        <span class="boot-letter boot-accent" style="--i: 4; --dir: 1"
          >S<i class="boot-drop" style="--dx: 1"></i
          ><i class="boot-drop boot-drop-b" style="--dx: -1"></i
        ></span>
        <span class="boot-letter boot-accent" style="--i: 5; --dir: -1">h</span>
        <span class="boot-letter boot-accent" style="--i: 6; --dir: 1">o</span>
        <span class="boot-letter boot-accent" style="--i: 7; --dir: -1">r</span>
        <span class="boot-letter boot-accent" style="--i: 8; --dir: 1"
          >e<i class="boot-drop" style="--dx: 1"></i
        ></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
