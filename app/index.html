<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- The browser chrome matches the ground in both schemes. App.tsx points
         both at the active --bg when the person pins a theme in Settings. -->
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17140e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- The splash wordmark is set in Fraunces. Preloaded, and declared below
         with font-display: block, so the letters rise in the real face and
         never swap from a fallback serif mid-rise. -->
    <link
      rel="preload"
      href="./src/fonts/fraunces-standard.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      One CSP for both shells (Electron window and the iOS WebView). Scripts
      only from the bundle; connect-src stays open because the phone talks to
      the desktop daemon on Tailscale IPs and to providers the user connects.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src *"
    />
    <title>OpenShore</title>
    <!--
      Boot splash. Painted the instant the document parses, before the bundle
      loads and React mounts, so opening OpenShore never shows a blank window
      (desktop Electron) or the gap between the iOS launch image and the first
      React frame. It speaks the Swell Line (Creative Studio, 2026-09-24), the
      same motion as the first open's letter: the mark, then each letter of the
      wordmark, rises 0.14em from below, crests 0.05em above its line, and
      settles, far longer than the step between them, so many move at once and
      it reads as one low wave. No bounce, no rotation, no droplets. It holds
      (main.tsx enforces a minimum on-screen time so it never flashes past on a
      fast device), then cross-fades as the app arrives.

      Motion exemption: this paints before the bundle (and the motion tokens in
      theme.css) can load, so its curves and durations are literal by
      necessity. They mirror the tokens by value: the swell is --ease-ink
      cubic-bezier(0.35, 0, 0.25, 1) over --dur-swell 600ms, the exit is
      --ease-arrive cubic-bezier(0.22, 1, 0.36, 1). It honors reduced motion
      inline (polish-standards.test.ts exempts only this file, for this reason).
      Colors mirror the --bg, --ink, and --accent tokens of both themes; the
      splash follows the system scheme, since a pinned theme lives in settings
      the bundle has not read yet.

      Timing knobs live in two places, tune both together:
        - the swell and exit durations here in this <style>
        - SPLASH_MIN_MS (the hold) in src/main.tsx
      Inline styles are allowed by the CSP's style-src 'unsafe-inline'.
    -->
    <style>
      @font-face {
        font-family: 'Fraunces';
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url('./src/fonts/fraunces-standard.woff2') format('woff2');
      }
      #boot-splash {
        --splash-bg: #f6f4ef;
        --splash-ink: #1c2a33;
        --splash-accent: #2f5a66;
        --splash-crest: brightness(1);
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        /* Horizontal lockup: wave-mark tile beside the wordmark, on one row,
           the same two-part shape as the in-app greeting. */
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--splash-bg);
        opacity: 1;
        transform: scale(1);
        /* Exit: the whole lockup eases up and dissolves as the app appears. */
        transition:
          opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      /* The dark ground, the same warm brown-black as the app's dark --bg, so
         a dark-mode open never flashes cream. */
      @media (prefers-color-scheme: dark) {
        #boot-splash {
          --splash-bg: #17140e;
          --splash-ink: #ece5d6;
          --splash-accent: #6bb3c4;
          --splash-crest: brightness(1.14);
        }
      }
      #boot-splash.boot-splash-hidden {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      /* The mark and the wordmark share one em (the wordmark's 36px), so the
         tile rises by the same 0.14em as the letters beside it. */
      #boot-splash .boot-mark {
        width: 56px;
        height: 56px;
        font-size: 36px;
        animation: boot-swell 0.6s cubic-bezier(0.35, 0, 0.25, 1) 0.12s backwards;
      }
      #boot-splash .boot-wordmark {
        font-family: 'Fraunces', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
        font-weight: 500;
        /* font-size: 0 on the container so the whitespace between the letter
           spans (each on its own line in the markup) collapses to zero width.
           The real size lives on the letters. */
        font-size: 0;
        letter-spacing: 0.02em;
        color: var(--splash-ink);
      }
      #boot-splash .boot-wordmark .boot-accent {
        color: var(--splash-accent);
      }
      /* Each letter swells on its own delay: a 60ms step after the mark, far
         shorter than the 600ms swell, so most of the word is moving at once.
         `backwards` holds the sunk, clear from-state through the delay and
         lets go of the end state, so nothing pins a transform. The run ends
         near 1.3s, well inside the 2.7s hold. */
      #boot-splash .boot-wordmark .boot-letter {
        display: inline-block;
        font-size: 36px;
        animation: boot-swell 0.6s cubic-bezier(0.35, 0, 0.25, 1) backwards;
        animation-delay: calc(0.24s + var(--i) * 0.06s);
      }
      /* The Swell Line, by value (theme.css @keyframes swell). */
      @keyframes boot-swell {
        0% {
          opacity: 0;
          transform: translateY(0.14em);
          filter: blur(0.08em) brightness(1);
        }
        45% {
          opacity: 1;
          transform: translateY(-0.05em);
          filter: blur(0) var(--splash-crest);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0) brightness(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-mark,
        #boot-splash .boot-wordmark .boot-letter {
          animation: none;
        }
        #boot-splash {
          transition: opacity 0.3s linear;
        }
        #boot-splash.boot-splash-hidden {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="img" aria-label="OpenShore">
      <svg class="boot-mark" viewBox="0 0 32 32" focusable="false" aria-hidden="true">
        <rect width="32" height="32" rx="7.5" fill="#1c2a33" />
        <g transform="translate(0 -0.81)">
          <line
            x1="7"
            y1="13"
            x2="25"
            y2="13"
            stroke="#f6f4ef"
            stroke-width="2"
            stroke-linecap="round"
          />
          <path
            d="M7 19q4.5-3.3 9 0t9 0"
            fill="none"
            stroke="#4b90a3"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>
      </svg>
      <div class="boot-wordmark" aria-hidden="true">
        <span class="boot-letter" style="--i: 0">O</span>
        <span class="boot-letter" style="--i: 1">p</span>
        <span class="boot-letter" style="--i: 2">e</span>
        <span class="boot-letter" style="--i: 3">n</span>
        <span class="boot-letter boot-accent" style="--i: 4">S</span>
        <span class="boot-letter boot-accent" style="--i: 5">h</span>
        <span class="boot-letter boot-accent" style="--i: 6">o</span>
        <span class="boot-letter boot-accent" style="--i: 7">r</span>
        <span class="boot-letter boot-accent" style="--i: 8">e</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
