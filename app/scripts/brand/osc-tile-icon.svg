<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#223039"/>
      <stop offset="1" stop-color="#162028"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cream" gradientUnits="userSpaceOnUse" x1="480" y1="384" x2="544" y2="448">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f6f4ef"/>
      <stop offset="1" stop-color="#c2bbad"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0.14" y2="1">
      <stop offset="0" stop-color="#5e9dad"/>
      <stop offset="0.5" stop-color="#4b90a3"/>
      <stop offset="1" stop-color="#2f5c6a"/>
    </linearGradient>
    <filter id="tube" filterUnits="userSpaceOnUse" x="120" y="330" width="784" height="430">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="shb"/>
      <feOffset in="shb" dx="0" dy="16" result="sho"/>
      <feFlood flood-color="#06121b" flood-opacity="0.5" result="shc"/>
      <feComposite in="shc" in2="sho" operator="in" result="shadow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
      <feSpecularLighting in="b" surfaceScale="9" specularConstant="0.95"
                          specularExponent="20" lighting-color="#ffffff" result="s">
        <feDistantLight azimuth="225" elevation="56"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="sc"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <path d="M224 416 L800 416" fill="none" stroke="url(#cream)" stroke-width="64"
        stroke-linecap="round" filter="url(#tube)"/>
  <path d="M224 608 Q368 502.4 512 608 T800 608" fill="none" stroke="url(#teal)" stroke-width="64"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#tube)"/>
</svg>
